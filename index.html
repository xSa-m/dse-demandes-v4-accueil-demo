<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSE Demandes — Accueil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="piv-bar" aria-hidden="true"></div>

    <header class="site-header">
      <div class="wrap">
        <p class="service-name">DSE Demandes</p>
        <h1 id="page-title">Accueil</h1>
      </div>
    </header>

    <p class="demo-banner" role="status">
      Démo UI — pas Charlemagne, pas Acrobat, pas de vraies demandes.
    </p>

    <div class="wrap">
      <div class="live-band" id="live-band" aria-label="Bande live">
        <div class="live-field" data-live="file">
          <span class="live-label">Fichier</span>
          <span class="live-value" id="live-file">—</span>
        </div>
        <div class="live-field" data-live="action">
          <span class="live-label">Action</span>
          <span class="live-value" id="live-action">Accueil</span>
        </div>
        <div class="live-field" data-live="bar">
          <span class="live-label">Avancement</span>
          <div class="live-bar-wrap" aria-hidden="true">
            <div class="live-bar" id="live-bar" style="width: 0%"></div>
          </div>
        </div>
        <div class="live-field" data-live="eta">
          <span class="live-label">ETA</span>
          <span class="live-value" id="live-eta">—</span>
        </div>
      </div>
    </div>

    <main>
      <section id="view-accueil" class="view">
        <div class="tile-band">
          <div class="wrap">
            <div class="portes" aria-label="Portes">
              <button type="button" class="tile" data-go="traiter">
                <span class="tile-title">Traiter</span>
                <span class="tile-arrow" aria-hidden="true"></span>
              </button>
              <button type="button" class="tile" data-go="verifier">
                <span class="tile-title">Vérifier</span>
                <span class="tile-arrow" aria-hidden="true"></span>
              </button>
              <button type="button" class="tile" data-go="controler">
                <span class="tile-title">Contrôler</span>
                <span class="tile-arrow" aria-hidden="true"></span>
              </button>
            </div>
            <div class="accueil-actions">
              <button type="button" class="btn-primary" id="btn-diagnostiquer">
                Diagnostiquer
              </button>
              <button type="button" class="btn-secondary" data-go="parametres">
                Paramètres
              </button>
            </div>
          </div>
        </div>

        <div class="wrap">
          <section
            class="diag-panel"
            id="diag-panel"
            hidden
            aria-live="polite"
            aria-label="Rapport de diagnostic"
          >
            <h2>Diagnostic</h2>
            <ol class="diag-list" id="diag-list"></ol>
            <div class="diag-pc" id="diag-pc"></div>
            <label class="diag-copy-label" for="diag-report">Rapport</label>
            <textarea id="diag-report" class="diag-report" readonly rows="16"></textarea>
            <div class="diag-actions">
              <button type="button" class="btn-primary" id="btn-copy-report">
                Copier le rapport
              </button>
              <span class="copy-status" id="copy-status" hidden>Copié.</span>
            </div>
          </section>
        </div>
      </section>

      <section id="view-traiter" class="view wrap" hidden>
        <h2>Identité</h2>
        <ul class="score-list" id="score-list"></ul>
        <div class="disclosure" aria-label="Actions Identité">
          <button type="button" class="btn-primary" id="btn-choisir">Choisir</button>
          <button type="button" class="btn-secondary" id="btn-ouvrir-pdf">Ouvrir PDF</button>
          <button type="button" class="btn-secondary" id="btn-classer">Classer…</button>
          <button type="button" class="btn-secondary" id="btn-manuel">Traitement manuel</button>
        </div>
        <p class="feedback" id="traiter-feedback" hidden></p>
        <button type="button" class="btn-link" data-go="accueil">Accueil</button>
      </section>

      <section id="view-verifier" class="view wrap" hidden>
        <h2>Aucun élément</h2>
        <button type="button" class="btn-primary" data-go="accueil">Accueil</button>
      </section>

      <section id="view-controler" class="view wrap" hidden>
        <h2>Aucun élément</h2>
        <button type="button" class="btn-primary" data-go="accueil">Accueil</button>
      </section>

      <section id="view-parametres" class="view wrap" hidden>
        <form id="params-form" class="params-form">
          <label class="field">
            <span>Arrêt</span>
            <select name="arret" id="opt-arret">
              <option value="jamais">Ne jamais s’arrêter</option>
              <option value="identite">Après Identité</option>
              <option value="documents">Après Documents</option>
            </select>
          </label>
          <label class="check">
            <input type="checkbox" name="adresseSure" id="opt-adresse" />
            <span>Adresse sûre</span>
          </label>
          <label class="check">
            <input type="checkbox" name="documentsSurs" id="opt-documents" />
            <span>Documents sûrs</span>
          </label>
          <label class="field">
            <span>Après Documents</span>
            <select name="apresDocuments" id="opt-apres">
              <option value="continuer">Continuer</option>
              <option value="accueil">Accueil</option>
              <option value="verifier">Vérifier</option>
            </select>
          </label>
          <div class="params-actions">
            <button type="submit" class="btn-primary">Enregistrer</button>
            <button type="button" class="btn-secondary" data-go="accueil">Accueil</button>
          </div>
          <p class="feedback" id="params-feedback" hidden></p>
        </form>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
